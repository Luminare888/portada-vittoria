<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivo de la Hermandad · Códice</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<button id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button>
<div class="app">
<aside id="sidebar" aria-label="Navegación del archivo">
  <!-- Sustituye URL_DE_TU_IMAGEN por la URL de tu emblema (se muestra a 78x78 px) -->
  <img class="emblem" src="https://i.imgur.com/GVnlMLx.png" alt="Emblema de la Hermandad" width="78" height="78">
  <h1>ARCHIVO DE JIKOGISEI</h1>
  <p class="sub">Registro de memorias</p>
  <nav id="nav"></nav>
  <label class="snd"><input type="checkbox" id="sound" checked> Efectos de sonido</label>
</aside>
<main>
  <div class="book" id="book">
    <article class="page" id="pageL"></article>
    <article class="page" id="pageR"></article>
  </div>
  <div class="controls">
    <button id="prev">← Anterior</button>
    <button id="home">Portada</button>
    <span id="ind" aria-live="polite"></span>
    <button id="next">Siguiente →</button>
  </div>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
